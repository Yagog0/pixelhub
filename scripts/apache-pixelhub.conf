# Configuração restrita à PixelHub. PHP já está carregado pelo Apache local.
<Directory "D:/Apache24/htdocs/Projetos/milionario">
    DirectoryIndex index.php
    Options -Indexes
    AllowOverride All
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
    php_value upload_max_filesize 20M
    php_value post_max_size 22M
</Directory>
<DirectoryMatch "^D:/Apache24/htdocs/Projetos/milionario/(app|config|database|views|scripts|tests|docs|node_modules|test-results|\.git)(/|$)">
    Require all denied
</DirectoryMatch>
